services:
  ros_noetic:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        USE_CN_MIRROR: "${USE_CN_MIRROR:-0}"
        USER_UID: "${USER_UID:-1000}"
        USER_GID: "${USER_GID:-1000}"
    image: ros_noetic_hw:latest
    container_name: ros_noetic_hw
    # 不要设 hostname:network_mode host 下容器用宿主机 /etc/hosts,
    # 自定义主机名解析不了会让 roscore 起不来。
    stdin_open: true
    tty: true
    network_mode: host
    ipc: host
    environment:
      # 用 compose 前先跑 ./x11_setup.sh 生成 /tmp/.docker.xauth,并 export DISPLAY
      - DISPLAY=${DISPLAY:-:0}
      - QT_X11_NO_MITSHM=1
      - XAUTHORITY=/tmp/.docker.xauth
      - ROS_HOSTNAME=localhost
      - ROS_MASTER_URI=http://localhost:11311
      - ROS_WORKSPACE=/workspace
    volumes:
      - ../:/workspace:rw
      - /tmp/.X11-unix:/tmp/.X11-unix:rw
      - /tmp/.docker.xauth:/tmp/.docker.xauth:rw
    devices:
      - /dev/dri:/dev/dri
    working_dir: /workspace
    command: bash
